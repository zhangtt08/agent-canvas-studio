[workspace]
resolver = "2"
members = ["core", "cli", "app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["AgentCanvas"]
repository = "https://local/agentcanvas"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.test]
opt-level = 1
