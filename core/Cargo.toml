[package]
name = "agentcanvas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AgentCanvas engine + RPC surface: document model, layout solver, SVG compiler, raster renderer, HTTP/MCP/CLI transport"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images", "system-fonts", "image-webp", "memmap-fonts", "gif"] }
rayon = "1"

[dev-dependencies]
tempfile = "3"
